openapi: 3.0.3
info:
  title: API do Meu Campus 
  version: 1.0.0
  description: Backend oficial do aplicativo {nome a definir} para acessibilidade e rotas.

paths:
  /buildings:
    get:
      summary: Lista todos os prédios cadastrados
      description: Retorna uma lista contendo todos os prédios ativos e seus respectivos pontos de acessibilidade (como elevadores, rampas e banheiros PCD).
      responses:
        '200':
          description: Sucesso ao retornar a lista de prédios.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "bldg_001"
                        name:
                          type: string
                          example: "Faculdade de Filosofia, Letras e Ciências Humanas"
                        address:
                          type: string
                          example: "Rua do Lago, 717, Butantã, São Paulo - SP, 05508-080"
                        phone:
                          type: string
                          example: "(11) 3091-4612"
                        email:
                          type: string
                          example: "fflch@usp.br"
                        website:
                          type: string
                          example: "https://www.fflch.usp.br/"
                        acessibilityPoints:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: "poi_001"
                              category:
                                type: string
                                example: "elevator"
                              name:
                                type: string
                                example: "Elevador Principal"
        '500':
          description: Erro interno no servidor ou falha de comunicação com o banco D1.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: "ERR_FETCH_BUILDINGS_FAILED"
                      message:
                        type: string
                        example: "Não foi possível carregar a lista de prédios."
